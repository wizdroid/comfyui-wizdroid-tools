[project]
name = "comfyui-wizdroid-tools"
version = "2026.08.10"
description = "Clean, powerful utility nodes for ComfyUI — LLM image prompts, character prompts, VL image extract, ACE-Step lyrics, text rewrite, and more."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Wizdroid"}
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Repository = "https://github.com/wizdroid/comfyui-wizdroid-tools"

[tool.setuptools.packages.find]
include = ["lib*", "nodes*"]
